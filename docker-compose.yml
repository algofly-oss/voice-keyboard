name: voice-keyboard

# Choose where Whisper runs with COMPOSE_PROFILES (in ./.env or the shell):
#   gpu  NVIDIA GPU (default; needs the NVIDIA Container Toolkit)
#   cpu  CPU only; works on machines without an NVIDIA GPU, or by choice
# When switching, run `docker compose down` first (both use the same port).
#
# HTTPS is on by default: the `https` service (Caddy) serves the app on
# HTTPS_PORT with an automatic certificate (see backend/caddy/Caddyfile).
# The gateway's plain-HTTP port is only published on 127.0.0.1 unless
# API_BIND says otherwise (e.g. 0.0.0.0 for a tunnel that connects over HTTP).

x-transcription: &transcription
  build:
    context: .
    dockerfile: backend/Dockerfile
  restart: unless-stopped
  ports:
    - "${API_BIND:-127.0.0.1}:${API_PORT:-8271}:8000"
  networks:
    default:
      aliases: [gateway]  # the name Caddy proxies to, whichever profile runs
  env_file:
    - path: ./backend/.env
      required: false
  environment: &environment
    TRANSCRIPTION_PORT: "${TRANSCRIPTION_PORT:-8001}"
    STT_MODEL_TTL: "-1"
    WHISPER__NUM_WORKERS: "1"
    ENABLE_UI: "false"
    LOG_LEVEL: "info"
  volumes:
    - ./backend/volumes/huggingface:/root/.cache/huggingface
    - ./backend/volumes/gateway:/data
  healthcheck:
    test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 180s

services:
  transcription:
    <<: *transcription
    profiles: [gpu]
    environment:
      <<: *environment
      WHISPER_DEVICE: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  transcription-cpu:
    <<: *transcription
    profiles: [cpu]
    environment:
      <<: *environment
      WHISPER_DEVICE: cpu

  https:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    environment:
      VK_DOMAIN: "${VK_DOMAIN:-localhost}"
      VK_TLS: "${VK_TLS:-internal}"
      VK_DEFAULT_SNI: "${VK_DEFAULT_SNI:-localhost}"
      VK_HTTPS_PORT: "${HTTPS_PORT:-443}"
    volumes:
      - ./backend/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./backend/volumes/caddy:/data  # certificates and the local CA; keep it
