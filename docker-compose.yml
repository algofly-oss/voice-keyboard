name: voice-keyboard

# Choose where Whisper runs with COMPOSE_PROFILES (in ./.env or the shell):
#   gpu  NVIDIA GPU (default; needs the NVIDIA Container Toolkit)
#   cpu  CPU only; works on machines without an NVIDIA GPU, or by choice
# When switching, run `docker compose down` first (both use the same port).
#
# The `https` service (Caddy) is the only way in; the gateway is not published.
# VK_PROTOCOL=https (default): the app on HTTPS_PORT with automatic certificates,
# HTTP_PORT redirects to it. VK_PROTOCOL=http: the app on HTTP_PORT only, behind
# a tunnel/proxy that adds HTTPS. VK_PROTOCOL=both: the app on both ports.
# See docs/https.md.

x-transcription: &transcription
  build:
    context: .
    dockerfile: backend/Dockerfile
  restart: unless-stopped
  networks:
    default:
      aliases: [gateway]  # the name Caddy proxies to, whichever profile runs
  env_file:
    - path: ./.env   # the one settings file (see .env.example)
      required: false
  environment: &environment
    TRANSCRIPTION_PORT: "${TRANSCRIPTION_PORT:-8001}"
    STT_MODEL_TTL: "-1"
    WHISPER__NUM_WORKERS: "1"
    ENABLE_UI: "false"
    VK_TLS: "${VK_TLS:-internal}"  # tells the web UI whether install commands must trust a local CA
    VK_PROTOCOL: "${VK_PROTOCOL:-https}"
    LOG_LEVEL: "info"
  volumes:
    - ./backend/volumes/huggingface:/root/.cache/huggingface
    - ./backend/volumes/gateway:/data
    - ./backend/volumes/caddy:/caddy:ro  # the local CA, for clients using a local address
  healthcheck:
    test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 180s

services:
  transcription:
    <<: *transcription
    profiles: [gpu]
    environment:
      <<: *environment
      WHISPER_DEVICE: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  transcription-cpu:
    <<: *transcription
    profiles: [cpu]
    environment:
      <<: *environment
      WHISPER_DEVICE: cpu

  https:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTPS_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
    environment:
      VK_DOMAIN: "${VK_DOMAIN:-localhost}"
      VK_TLS: "${VK_TLS:-internal}"
      VK_PROTOCOL: "${VK_PROTOCOL:-https}"
      VK_HTTPS_PORT: "${HTTPS_PORT:-443}"
      VK_DEFAULT_SNI: "${VK_DEFAULT_SNI:-localhost}"
    volumes:
      - ./backend/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./backend/caddy/https.caddy:/etc/caddy/https.caddy:ro
      - ./backend/caddy/http.caddy:/etc/caddy/http.caddy:ro
      - ./backend/caddy/both.caddy:/etc/caddy/both.caddy:ro
      - ./backend/volumes/caddy:/data  # certificates and the local CA; keep it
