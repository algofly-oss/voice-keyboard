name: voice-keyboard

# Choose where Whisper runs with COMPOSE_PROFILES (in ./.env or the shell):
#   gpu  NVIDIA GPU (default; needs the NVIDIA Container Toolkit)
#   cpu  CPU only; works on machines without an NVIDIA GPU, or by choice
# When switching, run `docker compose down` first (both use the same port).
#
# The app is served only over HTTPS: the `https` service (Caddy) listens on
# HTTPS_PORT with an automatic certificate (see backend/caddy/Caddyfile) and
# redirects plain HTTP on that port. The gateway is not published at all.

x-transcription: &transcription
  build:
    context: .
    dockerfile: backend/Dockerfile
  restart: unless-stopped
  networks:
    default:
      aliases: [gateway]  # the name Caddy proxies to, whichever profile runs
  env_file:
    - path: ./backend/.env
      required: false
  environment: &environment
    TRANSCRIPTION_PORT: "${TRANSCRIPTION_PORT:-8001}"
    STT_MODEL_TTL: "-1"
    WHISPER__NUM_WORKERS: "1"
    ENABLE_UI: "false"
    VK_TLS: "${VK_TLS:-internal}"  # tells the web UI whether install commands must trust a local CA
    LOG_LEVEL: "info"
  volumes:
    - ./backend/volumes/huggingface:/root/.cache/huggingface
    - ./backend/volumes/gateway:/data
  healthcheck:
    test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 180s

services:
  transcription:
    <<: *transcription
    profiles: [gpu]
    environment:
      <<: *environment
      WHISPER_DEVICE: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  transcription-cpu:
    <<: *transcription
    profiles: [cpu]
    environment:
      <<: *environment
      WHISPER_DEVICE: cpu

  https:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTPS_PORT:-443}:443"
    environment:
      VK_DOMAIN: "${VK_DOMAIN:-localhost}"
      VK_TLS: "${VK_TLS:-internal}"
      VK_DEFAULT_SNI: "${VK_DEFAULT_SNI:-localhost}"
    volumes:
      - ./backend/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./backend/volumes/caddy:/data  # certificates and the local CA; keep it
