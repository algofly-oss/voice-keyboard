name: voice-keyboard

services:
  transcription:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-8271}:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      WHISPER_MODEL: "${WHISPER_MODEL:-deepdml/faster-whisper-large-v3-turbo-ct2}"
      TRANSCRIPTION_PORT: "${TRANSCRIPTION_PORT:-8001}"
      WHISPER__MODEL: "${WHISPER_MODEL:-deepdml/faster-whisper-large-v3-turbo-ct2}"
      STT_MODEL_TTL: "-1"
      WHISPER__COMPUTE_TYPE: "${WHISPER_COMPUTE_TYPE:-int8_float16}"
      WHISPER__INFERENCE_DEVICE: "cuda"
      WHISPER__NUM_WORKERS: "1"
      WHISPER__CPU_THREADS: "4"
      ENABLE_UI: "false"
      LOG_LEVEL: "info"
    volumes:
      - ./backend/volumes/huggingface:/root/.cache/huggingface
      - ./backend/volumes/gateway:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
