# Generate the Xcode project on a Mac with:  brew install xcodegen && xcodegen
name: VoiceKeyboard
options:
  bundleIdPrefix: ai.algofly
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: ""          # set your Apple team ID, or pick it in Xcode
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  VoiceKeyboard:
    type: application
    platform: iOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Voice Keyboard
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: Voice Keyboard records your voice while you dictate and sends it to your own transcription server.
        CFBundleURLTypes:
          - CFBundleURLName: ai.algofly.voicekeyboard
            CFBundleURLSchemes: [voicekeyboard]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: App/VoiceKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.ai.algofly.voicekeyboard]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.algofly.voicekeyboard
    dependencies:
      - target: VoiceKeyboardKeyboard
  VoiceKeyboardKeyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard, Shared/SharedStore.swift, Shared/DictationBridge.swift]
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Voice Keyboard
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            RequestsOpenAccess: true
            PrimaryLanguage: mul
            IsASCIICapable: false
            PrefersRightToLeft: false
    entitlements:
      path: Keyboard/Keyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.ai.algofly.voicekeyboard]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.algofly.voicekeyboard.keyboard
